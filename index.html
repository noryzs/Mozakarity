<style>

.tc{display:grid;gap:14px;justify-items:center;padding:6px 0 16px}

#tt{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;padding:0 10px;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--hl) 50%,transparent) 62% 92%,transparent 92%)}
.tc .row{width:100%}
body{background:radial-gradient(120% 50% at 50% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent) var(--bg) no-repeat fixed}
.it,.hero,.bar,.dc{box-shadow:0 1px 2px #1b24500d,0 8px 18px -10px #1b245033}

.sw{width:44px;height:26px;border-radius:13px;background:var(--bd);position:relative;flex:none;transition:background .2s}

body{touch-action:manipulation;-webkit-user-select:none;user-select:none}

.tc .chips{justify-content:center;flex-wrap:wrap}

.sh{background:var(--cd);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--sab));display:grid;gap:10px;animation:sl .28s cubic-bezier(.2,.8,.2,1)}

.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--c);opacity:.3;transition:width .7s}
.bar span,.bar em{position:relative;font-style:normal}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{font-size:10px;text-align:center}
.dc{background:var(--cd);border:1px solid var(--bd);border-radius:8px;min-height:48px;padding:3px;text-align:center;font-size:13px}
.dc span{display:block;font-size:8px;line-height:1.1}
.tdy{border-color:var(--ac);font-weight:700}
.fc{text-align:center;display:grid;gap:14px;padding:20px 0;animation:pop .25s}
.an{background:var(--a2);border-radius:12px;padding:14px;white-space:pre-wrap}
.nt{white-space:pre-wrap;color:var(--mu);font-size:14px;max-height:4.5em;overflow:hidden}
#to{position:fixed;inset:auto 0 calc(96px + var(--sab));margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 S.rw.forEach(r=>{const[c,m]=rwp(r);if(!r.got&&c>=m){r.got=dt;save();boom();toast('🎁 '+r.t)}});
}
function vMs(){const m=MS();return `<h4>🎯 ${t('msn')} ${m.filter(x=>x[1]).length}/3</h4>`+m.map(x=>`<div class="it ${x[1]?'dn':''}" style="--c:var(--ac)"><div><b>${x[1]?'✅':'⬜'} ${t(x[0])}</b></div></div>`).join('')+`<small>${t('msb')}</small>`}
function cmp(){
 const m=S.set.cmp,t0=today();
 if(m=='d')return[mins(t0,t0),mins(addD(t0,-1),addD(t0,-1))];
 if(m=='w'){const k=(new Date().getDay()+1)%7,w=wk(),pw=addD(w,-7);return[mins(w,t0),mins(pw,addD(pw,k))]}
 const d=+t0.slice(8),pm=new Date(+t0.slice(0,4),+t0.slice(5,7)-2,1),ps=pm.toLocaleDateString('en-CA'),ml=new Date(pm.getFullYear(),pm.getMonth()+1,0).getDate();
 return[mins(t0.slice(0,8)+'01',t0),mins(ps,ps.slice(0,8)+String(Math.min(d,ml)).padStart(2,'0'))];
}
function vCmp(){
 const m=S.set.cmp,[c,p]=cmp(),mx=Math.max(c,p),msg=!c&&!p?t('cmz'):!p?t('cmn'):c>=p?`${t('cup')} ${Math.round((c-p)/p*100)}%`:`${t('cdn')} ${p-c} ${t('mn')}`;
 return `<h4>${t('cmp')}</h4><div class="chips">${[['d','cmd'],['w','cmw'],['m','cmm']].map(x=>`<button class="c ${m==x[0]?'on':''}" onclick="S.set.cmp='${x[0]}';save();render()">${t(x[1])}</button>`).join('')}</div>`+bar(t('c'+m+'1'),'var(--ac)',c,mx,c+' '+t('mn'))+bar(t('c'+m+'2'),'#64748b',p,mx,p+' '+t('mn'))+`<small style="margin-top:6px">${msg}</small>`;
}
function vPlan(){
 const E=S.ex.map(e=>({e,n:dd(e.d)})).filter(x=>x.n>=0&&x.n<=7);if(!E.length)return'';
 const W=E.map(x=>{const u=sub(x.e.sub);return[x,(u.df||2)*(1+((u.ch||[]).length?1-pc(u)/100:1))/(x.n+1)]}),sm=W.reduce((a,x)=>a+x[1],0);
 return `<h4>🗓 ${t('xp7')}</h4>`+W.map(([x,w])=>{const u=sub(x.e.sub);return `<div class="it" style="--c:${u.color}"><div><b>${esc(u.name)}</b><small>${dl(x.e.d)}${(u.ch||[]).length?' · '+t('rdy')+' '+pc(u)+'%':''}</small></div><div class="cd">${Math.max(10,Math.round(S.set.dg*w/sm/5)*5)} ${t('mn')}/${t('dys')}</div></div>`}).join('');
}
function rwp(r){
 if(r.kd=='sub'){const c=sub(r.ref).ch||[];return[c.filter(x=>x.dn).length,c.length||1]}
 if(r.kd=='wk')return[mins(wk(),today()),S.goal*60];
 if(r.kd=='sk')return[streak().n,r.n];
 return[mins('2000-01-01','2999-12-31'),r.n*60];
}
function vRw(){
 return `<h4>🎁 ${t('rw')}</h4>`+(S.rw.length?S.rw.map(r=>{const[c,m]=rwp(r),q=Math.min(100,Math.round(c/m*100));return `<div class="it" style="--c:var(--ac)"><div><b>${r.got?'🎉':'🔒'} ${esc(r.t)}</b><small>${t('rk'+({sub:1,wk:2,sk:3,hr:4}[r.kd]))}${r.kd=='sub'?' · '+esc(sub(r.ref).name):''} · ${r.got?t('rwo'):q+'%'}</small>${r.got?'':`<div class="pb"><i style="width:${q}%"></i></div>`}</div><button class="x" onclick="del('rw','${r.id}')">✕</button></div>`}).join(''):`<p class="mu">${t('rwno')}</p>`)+`<button class="b g" style="width:100%;margin-top:6px" onclick="addRw()">+ ${t('rwa')}</button>`;
}
function addRw(){sheet(t('rw'),[{k:'t',l:t('rwt'),r:1},{k:'kd',l:t('rwk'),o:[['sub',t('rk1')],['wk',t('rk2')],['sk',t('rk3')],['hr',t('rk4')]]},{k:'ref',l:t('rwr'),o:sOpts(1)},{k:'n',l:t('rwn'),t:'number',v:'7'}],v=>{
 if(v.kd=='sub'&&!v.ref){toast(t('needs'));return false}
 S.rw.push({id:uid(),t:v.t,kd:v.kd,ref:v.ref,n:Math.max(1,+v.n||1)});
})}
function logMin(m,sb,lab,b){const d=today(),p=mins(d,d),a=p+m;S.log.push({d,m,sub:sb});if(a<MN){save();if(b)boom();toast(`⏱ +${m} ${t('mn')} · ${a}/${MN} · ${t('mnn')}`)}else gain('+'+(p<MN?a:m)+' XP · '+lab,b)}
function part(){if(tm.m!='f')return;const e=Math.floor((S.set.fd*60-tm.left)/60);if(e>=1&&tm.left<S.set.fd*60)logMin(e,tm.sub,t('part'))}
function addLog(){sheet(t('log'),[{k:'sub',l:t('subj'),v:tm.sub,o:sOpts(1)},{k:'m',l:t('lgm'),t:'number',v:'30',r:1}],v=>{const m=Math.round(+v.m);if(!(m>=1&&m<=600)){toast(t('lgbad'));return false}logMin(m,v.sub,t('log'))})}
function addId(){sheet('💡 '+t('idea'),[{k:'t',l:t('idt'),t:'area',r:1}],v=>{S.id.unshift({id:uid(),t:v.t,d:today()});toast('💡 '+t('idok'))})}
function vCu(){
 if(!S.sub.length)return `<p class="em">${t('needs')}</p>`;
 const u=S.sub.find(x=>x.id==cs)||S.sub[0],c=u.ch||[];cs=u.id;
 return `<div class="chips">${S.sub.map(x=>`<button class="c ${x.id==cs?'on':''}" onclick="cs='${x.id}';render()">${esc(x.name)} ${pc(x)}%</button>`).join('')}</div><div class="hero"><div><b>${pc(u)}%</b><small>${t('rdy')}</small></div><div class="gl"><div class="pb"><i style="width:${pc(u)}%"></i></div></div></div>`
 +(c.length?c.map(x=>`<div class="it ${x.dn?'dn':''}" style="--c:${u.color}"><input type="checkbox" ${x.dn?'checked':''} onchange="tch('${x.id}')"><div><b>${esc(x.n)}</b></div><button class="x" onclick="delCh('${x.id}')">✕</button></div>`).join(''):`<p class="em">${t('nch')}</p>`)+fab('addCh()');
}
const cu=()=>S.sub.find(x=>x.id==cs)||S.sub[0];
function tch(id){const x=cu().ch.find(y=>y.id==id),k=today();x.dn=x.dn?0:1;if(x.dn){x.dd=k;S.xl[k]=(S.xl[k]||0)+SK}else if(x.dd){S.xl[x.dd]=(S.xl[x.dd]||0)-SK;x.dd=''}save();if(x.dn)gain('📘 +10 XP · 🔥',1);render()}
function delCh(id){const u=cu();u.ch=u.ch.filter(x=>x.id!=id);save();render()}
function addCh(){sheet(cu().name,[{k:'n',l:t('chn'),t:'area'},{k:'c',l:t('chc'),t:'number'},{k:'p',l:t('chp'),v:lg()?'Chapter':'الفصل'}],v=>{
 let a=v.n.split('\n').map(x=>x.trim()).filter(Boolean);
 if(!a.length&&+v.c>0)a=Array.from({length:Math.min(Math.round(+v.c),60)},(_,i)=>v.p+' '+(i+1));
 if(!a.length){toast(t('chn'));return false}
 const u=cu();u.ch=(u.ch||[]).concat(a.map(n=>({id:uid(),n,dn:0})));
})}
function addEr(){if(!S.sub.length)return need();sheet(t('er'),[{k:'sub',l:t('subj'),o:sOpts()},{k:'q',l:t('erq'),t:'area',r:1},{k:'a',l:t('era'),t:'area',r:1}],v=>{S.cards.push({id:uid(),box:0,due:today(),m:1,...v})})}
function calc(){sheet(t('need'),[{k:'sub',l:t('subj'),o:sOpts(1)},{k:'tg',l:t('ntg'),t:'number',v:'90',r:1},{k:'cu',l:t('ncu')+' ('+t('opt2')+')',t:'number'},{k:'co',l:t('nco')+' ('+t('opt2')+')',t:'number'},{k:'fo',l:t('nfo'),t:'number',v:'40',r:1}],v=>{
 let c=+v.cu,o=+v.co;if(v.sub&&!v.cu&&!v.co){const g=S.gr.filter(x=>x.sub==v.sub);c=g.reduce((a,x)=>a+x.s,0);o=g.reduce((a,x)=>a+x.mx,0)}
 const f=+v.fo,n=+v.tg/100*(o+f)-c;
 setTimeout(()=>info(n<=0?t('nok'):n>f?`${t('nhard')}<br>${n.toFixed(1)} / ${f}`:`🎯 ${t('nmust')}<br><b style="font-size:26px">${n.toFixed(1)} / ${f}</b> (${Math.round(n/f*100)}%)`),60);
})}
function vAt(){
 return S.sub.length?S.sub.map(u=>{const a=u.ab||0,l=u.al||0,r=l?a/l:0;return `<div class="it" style="--c:${u.color}"><div onclick="setAl('${u.id}')"><b>${esc(u.name)}</b><small>${l?`${t('abs')} ${a} / ${l}${r>=1?` · <span class="od">${t('abx')}</span>`:r>=.75?` · <span class="od">${t('aby')}</span>`:''}`:t('abset')}</small>${l?`<div class="pb"><i style="width:${Math.min(100,r*100)}%${r>=.75?';background:var(--rd)':''}"></i></div>`:''}</div><button class="x" onclick="ab('${u.id}',-1)">−</button><button class="x" onclick="ab('${u.id}',1)">＋</button></div>`}).join(''):`<p class="em">${t('needs')}</p>`;
}
function ab(id,d){const u=S.sub.find(x=>x.id==id);u.ab=Math.max(0,(u.ab||0)+d);save();render();if(d>0&&u.al){const r=u.ab/u.al;if(r>=1){vib([200,100,200]);info('🚨 '+esc(u.name)+'<br>'+t('abx'))}else if(r>=.75)info('⚠️ '+esc(u.name)+'<br>'+t('aby'))}}
function setAl(id){const u=S.sub.find(x=>x.id==id);sheet(u.name,[{k:'al',l:t('abl'),t:'number',v:u.al||'',r:1}],v=>{u.al=Math.max(1,Math.round(+v.al))})}
/* التنبيهات */
const NAT=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const P=n=>{try{return NAT()?(Capacitor.Plugins[n]||Capacitor.registerPlugin(n)):null}catch(e){return null}};
let nfSg='';
const nrow=(k,l)=>`<div class="it" style="--c:var(--a2)" onclick="tn('${k}')"><div><b>${t(l)}</b></div><span class="sw ${S.set[k]?'on':''}"></span></div>`;
function tn(k){S.set[k]=S.set[k]?0:1;if(k=='nt'&&!S.set.rt)S.set.rt='17:00';save();render();if(S.set[k])nfPerm()}
function rdt(d){const a=S.set.rd;S.set.rd=a.includes(d)?(a.length>1?a.filter(x=>x!=d):a):[...a,d];save();render()}
async function nfPerm(){const L=P('LocalNotifications');if(!L)return;try{let p=await L.checkPermissions();if(p.display!='granted')p=await L.requestPermissions();if(p.display!='granted')toast(t('nfno'))}catch(e){}nfSg='';nfSync()}
async function nfSync(){
 const L=P('LocalNotifications');if(!L)return;
 try{
  const pd=await L.getPending();if(pd.notifications.length)await L.cancel({notifications:pd.notifications});
  if(!(S.set.nt||S.set.ns||S.set.ne)||(await L.checkPermissions()).display!='granted')return;
  try{await L.createChannel({id:'study',name:t('nfh'),importance:4,vibration:true})}catch(e){}
  const q=[],now=new Date(),hm=x=>x.split(':').map(Number),at=(dt,x)=>{const d=new Date(dt);d.setHours(...hm(x),0,0);return d};
  if(S.set.nt){const[h,m]=hm(S.set.rt||'17:00');S.set.rd.forEach(d=>q.push({id:100+d,channelId:'study',title:'📚 '+t('nt1'),body:QU[d][lg()],schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}}))}
  if(S.set.ns)for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const w=at(d,S.set.st||'21:00');if(w<=now||(i==0&&dxp(today())>=SK))continue;q.push({id:200+i,channelId:'study',title:'🔥 '+t('nsg'),body:i?t('ns1'):(lg()?`Your streak is ${streak().n} days. Study 10 minutes before the day ends`:`ستريكك ${streak().n} يوم. ذاكر ١٠ دقايق قبل ما ينتهي اليوم`),schedule:{at:w,allowWhileIdle:true}})}
  if(S.set.ne)S.ex.slice(0,20).forEach((e,i)=>{const d=new Date(e.d+'T00:00'),b=new Date(d);b.setDate(b.getDate()-1);const nm=sub(e.sub).name;[[at(b,'18:00'),t('ex1'),300+i*2],[at(d,'07:00'),t('ex2'),301+i*2]].forEach(([w,tx,id])=>{if(w>now)q.push({id,channelId:'study',title:'🎯 '+nm,body:tx,schedule:{at:w,allowWhileIdle:true}})})});
  if(q.length)await L.schedule({notifications:q});
 }catch(e){}
}
async function nfTest(){
 const L=P('LocalNotifications');if(!L){toast(t('nfweb'));return}
 try{let p=await L.checkPermissions();if(p.display!='granted')p=await L.requestPermissions();if(p.display!='granted'){toast(t('nfno'));return}
  try{await L.createChannel({id:'study',name:t('nfh'),importance:4,vibration:true})}catch(e){}
  await L.schedule({notifications:[{id:999,channelId:'study',title:'📚 '+t('nt1'),body:t('nfok'),schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast(t('nfok'))}catch(e){toast('⚠️')}
}
/* الترحيب */
let ob=[];

function vOb(){
 return `<div class="fc" style="padding-top:30px"><h2>${t('wel')}</h2><p class="mu">${t('welp')}</p>
 <div class="chips" style="justify-content:center">${[['ar','العربية'],['en','English']].map(x=>`<button class="c ${S.set.lg==x[0]?'on':''}" onclick="S.set.lg='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div>
 <div class="chips" style="flex-wrap:wrap;justify-content:center">${obl().map((n,i)=>`<button class="c ${ob.includes(n)?'on':''}" onclick="tob(${i})">${esc(n)}</button>`).join('')}</div>
 <div class="row" style="margin:0"><input id="oi" placeholder="${t('own')}" onkeydown="if(event.key=='Enter')aob()"><button class="b g" style="flex:none" onclick="aob()">+</button></div>
 <div class="row"><button class="b g" onclick="S.set.ob=1;save();render(1)">${t('skip')}</button><button class="b" onclick="fob()">${t('go')}${ob.length?' ('+ob.length+')':''}</button></div></div>`;
}

/* الأساس */
const V={td:vTd,pl:vPl,tm:vTm,sd:vSd,st:vSt};
function gt(k){tab=k;if(k!='tm')document.body.classList.remove('fm');render(1)}

 theme();
 if(!S.sub.length&&!S.set.ob){$('#h').textContent='';$('#m').innerHTML=vOb();$('#n').innerHTML='';return}
 $('#h').textContent=t(N.find(x=>x[0]==tab)[1]);$('.xf').textContent=t('exf');
 $('#m').innerHTML=V[tab]();
 $('#n').innerHTML=N.map(x=>`<button class="${x[0]==tab?'on':''}" onclick="gt('${x[0]}')"><span>${x[2]}</span>${t(x[1])}</button>`).join('');
 if(a){const m=$('#m');m.classList.remove('in');void m.offsetWidth;m.classList.add('in')}
 chk();
}
{const q=new URLSearchParams(location.search).get('tab');if(q&&N.some(x=>x[0]==q))tab=q}
let lb=0;history.replaceState({r:1},'');history.pushState({a:1},'');
addEventListener('popstate',()=>{
 const o=$('.ov');if(o){o.remove();history.pushState({a:1},'');return}
 if(tab!='td'||rv||document.body.classList.contains('fm')){rv=null;document.body.classList.remove('fm');gt('td');history.pushState({a:1},'');return}
 if(Date.now()-lb<2200){const A=P('App');if(A){A.exitApp();return}history.back();return}
 lb=Date.now();history.pushState({a:1},'');toast(t('bk2'));
});
render(1);
if('serviceWorker' in navigator&&!NAT())navigator.serviceWorker.register('sw.js').catch(()=>{});
